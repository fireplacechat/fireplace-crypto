# Licence and source check for CI. cargo-deny is not a library dependency.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    # hpke-rs (HPKE for OpenMLS, feature `groups`, mobile decision 0050).
    # File-level copyleft, compatible with AGPL-3.0. Needs the owner's approval.
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

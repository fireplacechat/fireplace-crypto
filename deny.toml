# Licence and source check for CI. cargo-deny is not a library dependency.

[advisories]
version = 2
yanked = "deny"
# The same advisories as .cargo/audit.toml, for the same reasons
# (docs/dependencies.md, "Open advisories").
ignore = [
    { id = "RUSTSEC-2026-0329", reason = "libcrux-hmac-drbg is in Cargo.lock only; never compiled" },
    { id = "RUSTSEC-2026-0330", reason = "libcrux-kem is in Cargo.lock only; never compiled" },
    { id = "RUSTSEC-2026-0331", reason = "libcrux-kem is in Cargo.lock only; never compiled" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys is in Cargo.lock only; never compiled" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 is linked through p256 for MLS suites this crate refuses; no fixed version fits OpenMLS 0.9.2" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is a build-time macro of hax-lib; unmaintained, no fix available" },
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    # hpke-rs (HPKE for OpenMLS, feature `groups`, mobile decision 0050).
    # File-level copyleft, compatible with AGPL-3.0. Needs the owner's approval.
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

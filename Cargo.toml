[package]
name = "fireplace-crypto"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.1"
description = "Fireplace end-to-end encryption: identities, prekeys, handshake and the hybrid double ratchet"
license = "AGPL-3.0-only"
repository = "https://github.com/fireplacechat/fireplace-crypto"
readme = "README.md"
exclude = ["/tests", "/.github", "/target", "/spikes"]

[lib]
name = "fireplace_crypto"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
getrandom = { version = "=0.4.1", features = ["std", "sys_rng"] }
hkdf = { version = "=0.12.4", default-features = false }
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ml-kem = { version = "=0.3.4", default-features = false, features = ["alloc", "zeroize"] }
rand_core = { version = "=0.10.0" }
sha2 = { version = "=0.10.9", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.1", features = ["derive"] }
# Group chats (mobile decision 0050). Optional, so builds that do not need groups
# (the iOS notification extension) stay small.
openmls = { version = "=0.9.2", optional = true, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0", optional = true, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", optional = true, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0", optional = true }
openmls_traits = { version = "=0.6.0", optional = true }

[features]
default = []
# Off in every normal build. Turns on fp_set_test_rng for tests only.
test-rng = []
# MLS group chats, through the C functions in src/ffi_group.rs.
groups = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:openmls_memory_storage", "dep:openmls_traits"]

[profile.release]
panic = "unwind"

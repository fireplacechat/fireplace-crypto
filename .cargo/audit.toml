# Advisories that cargo-audit reports for this lockfile and that do not apply
# to what this crate builds or runs. Each is explained in docs/dependencies.md
# ("Open advisories"), and CI fails if the first four ever become part of the
# build. Remove an entry as soon as its crate can be upgraded.
[advisories]
ignore = [
    # In Cargo.lock only: optional dependencies of OpenMLS's crates that this
    # crate does not enable, so they are never compiled.
    "RUSTSEC-2026-0329", # libcrux-hmac-drbg 0.0.1
    "RUSTSEC-2026-0330", # libcrux-kem 0.0.9
    "RUSTSEC-2026-0331", # libcrux-kem 0.0.9
    "RUSTSEC-2026-0459", # libsqlite3-sys 0.35.0
    # Compiled (feature `groups`) through p256, which OpenMLS's RustCrypto
    # backend links for suites this crate refuses. See the note.
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5
]
